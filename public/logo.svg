<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer red ring -->
  <circle cx="60" cy="60" r="56" fill="#fff" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#b91c1c" stroke-width="1.2"/>

  <!-- Wreath leaves left -->
  <g fill="#15803d">
    <ellipse cx="22" cy="60" rx="3" ry="6" transform="rotate(-30 22 60)"/>
    <ellipse cx="26" cy="74" rx="3" ry="6" transform="rotate(-15 26 74)"/>
    <ellipse cx="34" cy="86" rx="3" ry="6" transform="rotate(15 34 86)"/>
    <ellipse cx="26" cy="46" rx="3" ry="6" transform="rotate(-50 26 46)"/>
    <ellipse cx="34" cy="34" rx="3" ry="6" transform="rotate(-70 34 34)"/>
  </g>
  <!-- Wreath leaves right -->
  <g fill="#15803d">
    <ellipse cx="98" cy="60" rx="3" ry="6" transform="rotate(30 98 60)"/>
    <ellipse cx="94" cy="74" rx="3" ry="6" transform="rotate(15 94 74)"/>
    <ellipse cx="86" cy="86" rx="3" ry="6" transform="rotate(-15 86 86)"/>
    <ellipse cx="94" cy="46" rx="3" ry="6" transform="rotate(50 94 46)"/>
    <ellipse cx="86" cy="34" rx="3" ry="6" transform="rotate(70 86 34)"/>
  </g>

  <!-- Inner emblem: stylized torch/pillar -->
  <g transform="translate(60 62)">
    <!-- Base -->
    <rect x="-14" y="22" width="28" height="4" rx="1" fill="#b91c1c"/>
    <rect x="-11" y="18" width="22" height="4" rx="1" fill="#b91c1c"/>
    <!-- Column -->
    <rect x="-4" y="-12" width="8" height="32" fill="#b91c1c"/>
    <!-- Capital -->
    <rect x="-9" y="-16" width="18" height="5" rx="1" fill="#b91c1c"/>
    <!-- Flame / chakra ring -->
    <circle cx="0" cy="-22" r="8" fill="none" stroke="#b91c1c" stroke-width="2"/>
    <g stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-34"/>
      <line x1="-6" y1="-27" x2="-9" y2="-30"/>
      <line x1="6" y1="-27" x2="9" y2="-30"/>
      <line x1="-7" y1="-22" x2="-11" y2="-22"/>
      <line x1="7" y1="-22" x2="11" y2="-22"/>
    </g>
  </g>

  <!-- Bottom ribbon text -->
  <path d="M 18 96 Q 60 110 102 96" stroke="#b91c1c" stroke-width="1" fill="none"/>
  <text x="60" y="105" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="1">FGIET</text>
</svg>
